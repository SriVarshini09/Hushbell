[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hushbell"
version = "0.1.0"
description = "Hushed all day. Rings when your kid needs you. An open-source agent that reads the school apps on your phone, handles the noise, and is the only call allowed through Do Not Disturb."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Hushbell contributors" }]
keywords = ["parents", "school", "do-not-disturb", "android", "agent", "langgraph", "claude"]
dependencies = [
  "anthropic>=1.0",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "twilio>=9.0",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "segno>=1.6",
  "langsmith>=0.3",
  "tavily-python>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
hushbell = "hushbell.cli:main"

[project.urls]
Homepage = "https://github.com/SriVarshini09/Hushbell"

[tool.hatch.build.targets.wheel]
packages = ["hushbell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
