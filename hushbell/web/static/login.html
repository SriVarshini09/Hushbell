<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#14203A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hushbell">
<title>Hushbell · Sign in</title>
<style>
:root{--paper:#F2F4F7;--ink:#14203A;--muted:#5C6679;--line:#D3DAE4;--card:#fff;--bell:#F4B400;--urgent:#D2433F;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#0F1522;--ink:#E8ECF4;--muted:#9AA5BA;--line:#2A3448;--card:#171F30;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
main{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px}
.bell{display:inline-block;background:var(--bell);color:#14203A;font-weight:800;letter-spacing:.08em;padding:6px 10px;border-radius:8px;font-size:14px}
h1{font-size:22px;margin:18px 0 6px}
p{color:var(--muted);margin:0 0 18px;font-size:15px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
button{margin-top:14px;width:100%;font:inherit;font-weight:700;padding:12px;border:0;border-radius:12px;background:var(--ink);color:var(--paper);cursor:pointer}
input:focus-visible,button:focus-visible{outline:3px solid var(--bell);outline-offset:2px}
.error{color:var(--urgent);font-weight:600}
</style>
</head>
<body>
<main>
  <span class="bell">HUSHBELL</span>
  <h1>Sign in</h1>
  <p>Enter the access token Hushbell printed when it started. You can also run <code>hushbell token</code> on the laptop.</p>
  <!--error-->
  <form method="post" action="/login">
    <label for="token">Access token</label>
    <input id="token" name="token" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Open Hushbell</button>
  </form>
  <p style="margin:16px 0 0;font-size:13px">On your phone? On the laptop page, press <b>Open on your phone</b> and scan the code instead.</p>
</main>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});</script>
</body>
</html>
